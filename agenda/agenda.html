<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Al-Imam Al-Rida School - Agenda</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../panel.css">
</head>
<body>
  <nav class="home-bar" aria-label="Primary navigation">
    <button id="panelToggle" class="button" type="button">Menu</button>
  </nav>
  <div id="pageDim" class="page-dim"></div>
  <aside id="rightPanel" class="right-panel" aria-hidden="true">
    <div class="panel-header"><strong>School menu</strong><button id="closePanel" class="close-btn" type="button">X</button></div>
    <div class="panel-body"><a href="../website/website.html">Home</a><a href="../agenda/agenda.html">Agenda</a><a href="../schedule/schedule.html">Schedule</a><a href="../live-classes/live-classes.html">Live Classes</a></div>
    <div class="panel-footer"><button id="logoutBtnPanel" class="logout-btn" type="button">Logout</button><button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch theme"><img src="../Images/sun.png" alt=""></button></div>
  </aside>

  <main class="page-content">
    <h1>Agenda</h1>
    <div id="userArea" class="user-area">
      <span id="userInfo"></span>
    </div>

    <div class="actions">
      <button id="addAgendaBtn" class="button" type="button">Add Agenda</button>
    </div>
    <div class="agenda-filters" aria-label="Filter agendas">
      <label for="dateFilter">Date</label>
      <select id="dateFilter">
        <option value="all">All dates</option>
      </select>
      <label for="sectionFilter">Section</label>
      <select id="sectionFilter">
        <option value="all">All sections</option>
      </select>
      <label for="subjectFilter">Subject</label>
      <select id="subjectFilter">
        <option value="all">All subjects</option>
      </select>
    </div>
    <p id="storageStatus" class="storage-status" aria-live="polite"></p>
    <div id="output" class="agenda-list" aria-live="polite"></div>
  </main>

  <dialog id="agendaDialog" class="agenda-dialog">
    <form id="agendaForm" method="dialog">
      <h2 id="agendaDialogTitle">Add agenda</h2>
      <fieldset>
        <legend>Subjects</legend>
        <div id="subjectOptions" class="subject-options"></div>
        <p id="subjectError" class="form-error" hidden>Select at least one subject.</p>
      </fieldset>

      <label for="agendaInput">Agenda</label>
      <textarea id="agendaInput" name="agenda" rows="4" required></textarea>

      <label for="dateInput">Date</label>
      <input id="dateInput" name="date" type="date" required>

      <fieldset>
        <legend>Sections</legend>
        <div id="sectionOptions" class="section-options"></div>
        <p id="sectionError" class="form-error" hidden>Select at least one section.</p>
      </fieldset>

      <div class="dialog-actions">
        <button id="cancelAgendaBtn" class="button secondary-button" type="button">Cancel</button>
        <button id="saveAgendaButton" class="button" type="submit">Add agenda</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>
  <script src="../theme.js"></script>
  <script src="../panel.js"></script>
  <script src="script.js"></script>
</body>
</html>
