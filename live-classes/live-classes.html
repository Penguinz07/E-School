<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Class</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="top-bar" aria-label="Primary navigation">
    <a href="../website/website.html" class="button">Back</a>
    <a href="../agenda/agenda.html" class="button secondary-button">Agenda</a>
    <button id="themeToggle" class="theme-toggle" type="button">Light mode</button>
  </nav>

  <main class="live-page">
    <header class="page-header">
      <div>
        <p class="eyebrow">Live classroom directory</p>
        <h1>Live Class</h1>
        <p id="modeText" class="mode-text">Choose a classroom to join.</p>
      </div>
      <span id="roleBadge" class="role-badge">Loading</span>
    </header>

    <section id="roomDirectory" class="room-directory" aria-label="Classroom directory">
      <div id="hostPanel" class="host-panel" hidden>
        <h2>Create a classroom</h2>
        <form id="roomForm" class="room-form">
          <label for="roomNameInput">Classroom name</label>
          <input id="roomNameInput" name="roomName" type="text" placeholder="Math with Mr Smith" required maxlength="60">
          <label for="sessionInput">Session</label>
          <input id="sessionInput" name="session" type="text" placeholder="Math" required maxlength="40">
          <label for="roomSectionInput">Sections</label>
          <select id="roomSectionInput" name="sections" multiple required></select>
          <p class="field-help">Hold Ctrl or Command to choose more than one section.</p>
          <button class="button" type="submit">Create classroom</button>
        </form>
      </div>
      <div class="room-list-heading">
        <h2>Available classrooms</h2>
        <button id="refreshRooms" class="button secondary-button" type="button">Refresh</button>
      </div>
      <div id="roomList" class="room-list" aria-live="polite"></div>
    </section>

    <section id="classroom" class="classroom" aria-label="Live classroom" hidden>
      <div class="classroom-heading">
        <div>
          <p class="eyebrow">Now viewing</p>
          <h2 id="activeRoomName">Classroom</h2>
        </div>
        <button id="leaveRoom" class="button secondary-button" type="button">Back to classrooms</button>
      </div>
      <div id="meet" class="meet-frame"></div>
      <p id="status" class="status" aria-live="polite">Preparing the classroom...</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>
  <script src="../theme.js"></script>
  <script src="https://meet.jit.si/external_api.js"></script>
  <script src="script.js"></script>
</body>
</html>
