<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Al-Imam Al-Rida School - Live Class</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="top-bar" aria-label="Primary navigation">
    <a href="../website/website.html" class="button">Home</a>
    <a href="../agenda/agenda.html" class="button secondary-button">Agenda</a>
  </nav>

  <main class="live-page">
    <header class="page-header">
      <div>
        <p class="eyebrow">School broadcast room</p>
        <h1>Live Class</h1>
        <p id="modeText" class="mode-text">Connecting to the classroom...</p>
      </div>
      <span id="roleBadge" class="role-badge">Loading</span>
    </header>

    <section class="classroom" aria-label="Live classroom">
      <div id="meet" class="meet-frame"></div>
      <p id="status" class="status" aria-live="polite">Preparing the classroom...</p>
    </section>
  </main>

  <script src="https://meet.jit.si/external_api.js"></script>
  <script src="script.js"></script>
</body>
</html>
